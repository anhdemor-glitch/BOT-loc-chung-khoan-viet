name: Run VN Stock Quant Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_market:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tải mã nguồn từ kho lưu trữ
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Cài đặt thư viện định lượng & vẽ đồ thị nến
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests rich matplotlib Pillow openpyxl

      - name: 4. Chạy BOT Quét 1.600+ Cổ Phiếu (Tự động dò file ck.py)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: |
          if [ -f "ck.py" ]; then
            python ck.py
          else
            FOUND_FILE=$(find . -maxdepth 3 -iname "ck.py" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              python "$FOUND_FILE"
            else
              echo "❌ LỖI: Bạn chưa tạo file ck.py trong kho lưu trữ!"
              exit 1
            fi
          fi

      - name: 5. Lưu File Excel, CSV & Ảnh Đồ Thị Nến T+0 vào GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update: Cập nhật dữ liệu & Đồ thị nến T+0" || true
          git pull --rebase origin main || true
          git push origin main || true
