name: Run VN Stock Quant Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_market:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tai ma nguon
        uses: actions/checkout@v4

      - name: 2. Cai dat Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Cai dat thu vien cho ck.py
        run: |
          pip install numpy pandas requests rich matplotlib Pillow openpyxl

      - name: 4. Chay file ck.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEETS_WEBHOOK_URL }}
        run: python ck.py

      - name: 5. Luu file Excel, CSV va Anh nen T+0 vao GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update: Cap nhat ket qua va do thi nen T+0"
          git push
